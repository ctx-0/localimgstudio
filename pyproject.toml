[project]
name = "localimgstudio"
version = "0.1.0"
description = "Local image processing pipeline for background removal and upscaling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn[standard]==0.41.0",
    "python-multipart==0.0.22",
    "pillow==12.1.1",
    "rembg[gpu]==2.0.72",
    "spandrel==0.4.2",
    "torch==2.10.0",
    "torchvision>=0.25.0",
    "requests==2.32.5",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
